services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.test}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.test}
      POSTGRES_PASSWORD:
        ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.test}
    ports:
      - '127.0.0.1:15433:5432'
    volumes:
      - nodus_test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nodus_test_postgres_data:
